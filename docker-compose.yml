services:
  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  usuarios-service:
    build:
      context: .
      dockerfile: usuarios-service/Dockerfile
    ports:
      - "8081:8081"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      INTERNAL_TOKEN: dev-local-token
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: guest
      SPRING_RABBITMQ_PASSWORD: guest
    depends_on:
      rabbitmq:
        condition: service_healthy

  pedidos-service:
    build:
      context: .
      dockerfile: pedidos-service/Dockerfile
    ports:
      - "8082:8082"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      INTERNAL_TOKEN: dev-local-token
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: guest
      SPRING_RABBITMQ_PASSWORD: guest
    depends_on:
      rabbitmq:
        condition: service_healthy

  envios-service:
    build:
      context: .
      dockerfile: envios-service/Dockerfile
    ports:
      - "8083:8083"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      INTERNAL_TOKEN: dev-local-token
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: guest
      SPRING_RABBITMQ_PASSWORD: guest
    depends_on:
      rabbitmq:
        condition: service_healthy

  notificaciones-service:
    build:
      context: .
      dockerfile: notificaciones-service/Dockerfile
    ports:
      - "8084:8084"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: guest
      SPRING_RABBITMQ_PASSWORD: guest
      TICKETS_OUTPUT_DIR: /app/tickets
    volumes:
      - tickets:/app/tickets
    depends_on:
      rabbitmq:
        condition: service_healthy

  rabbit-admin-service:
    build:
      context: .
      dockerfile: rabbit-admin-service/Dockerfile
    ports:
      - "8085:8085"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      INTERNAL_TOKEN: dev-local-token
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: guest
      SPRING_RABBITMQ_PASSWORD: guest
    depends_on:
      rabbitmq:
        condition: service_healthy

  bff:
    build:
      context: .
      dockerfile: bff/Dockerfile
    ports:
      - "8080:8080"
    environment:
      AZURE_TENANT_ID: a0937f8c-6713-4912-8198-29b1db9da9a5
      AZURE_API_CLIENT_ID: 598d6a64-0770-4213-bb07-34601e54499d
      USUARIOS_SERVICE_URL: http://usuarios-service:8081
      PEDIDOS_SERVICE_URL: http://pedidos-service:8082
      ENVIOS_SERVICE_URL: http://envios-service:8083
      RABBIT_ADMIN_SERVICE_URL: http://rabbit-admin-service:8085
      INTERNAL_TOKEN: dev-local-token
      CORS_ORIGINS: http://localhost:4200
    depends_on:
      - usuarios-service
      - pedidos-service
      - envios-service
      - rabbit-admin-service

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "4200:80"
    depends_on:
      - bff

volumes:
  tickets:
