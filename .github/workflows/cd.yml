name: CD

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  desplegar:
    name: Desplegar backend en EC2
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Empaquetar servicios
        run: ./mvnw --batch-mode clean package -DskipTests

      - name: Configurar credenciales AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Subir jars a S3
        run: |
          for svc in bff usuarios-service pedidos-service envios-service; do
            aws s3 cp "$svc/target/$svc-1.0.0.jar" "s3://${{ secrets.S3_BUCKET }}/$svc.jar"
          done

      - name: Reiniciar servicios en EC2
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --comment "Despliegue desde GitHub Actions" \
            --parameters 'commands=[
              "set -e",
              "for svc in bff usuarios-service pedidos-service envios-service; do aws s3 cp s3://${{ secrets.S3_BUCKET }}/$svc.jar /opt/pedidos360/$svc.jar; done",
              "systemctl restart usuarios-service pedidos-service envios-service",
              "sleep 30",
              "systemctl restart bff"
            ]' \
            --query "Command.CommandId" --output text)

          echo "Comando SSM: $COMMAND_ID"
          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.EC2_INSTANCE_ID }}" || true

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
            --query "{Estado:Status,Salida:StandardOutputContent,Error:StandardErrorContent}" \
            --output json

      - name: Verificar que el BFF responde
        run: |
          for intento in $(seq 1 20); do
            if curl -sf -m 5 "http://${{ secrets.EC2_HOST }}:8080/actuator/health"; then
              echo ""
              echo "BFF arriba"
              exit 0
            fi
            sleep 15
          done
          echo "El BFF no respondio tras el despliegue"
          exit 1
