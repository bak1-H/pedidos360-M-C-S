server:
  port: 8084

spring:
  application:
    name: notificaciones-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:azure}
  jpa:
    open-in-view: false
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:29092,localhost:29093,localhost:29094}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 5
      compression-type: lz4
      properties:
        enable.idempotence: true
        linger.ms: 10
        max.block.ms: 5000
        spring.json.add.type.headers: false
    consumer:
      group-id: ${kafka.grupo}
      auto-offset-reset: earliest
      enable-auto-commit: false
      max-poll-records: 50
      key-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.key.delegate.class: org.apache.kafka.common.serialization.StringDeserializer
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: com.pedidos360.notificaciones.consumer.kafka
        spring.json.use.type.headers: false
    listener:
      concurrency: 3
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:guest}
    password: ${SPRING_RABBITMQ_PASSWORD:guest}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        acknowledge-mode: manual
        default-requeue-rejected: false
        prefetch: 10

kafka:
  grupo: notificaciones-analitica
  topics:
    pedidos-eventos: pedidos360.pedidos.eventos
    envios-tracking: pedidos360.envios.tracking

rabbitmq:
  exchange: pedidos360.eventos
  dead-letter-exchange: pedidos360.eventos.dlx
  pedido-creado:
    queue: notificaciones.pedido.creado
    routing-key: pedido.creado
    dead-letter-queue: notificaciones.pedido.creado.dlq
    dead-letter-routing-key: notificaciones.pedido.creado.dlq

internal:
  token: ${INTERNAL_TOKEN}

management:
  endpoints:
    web:
      exposure:
        include: health,info
