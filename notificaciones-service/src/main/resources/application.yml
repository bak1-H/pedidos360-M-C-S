server:
  port: 8084

spring:
  application:
    name: notificaciones-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:azure}
  jpa:
    open-in-view: false
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:guest}
    password: ${SPRING_RABBITMQ_PASSWORD:guest}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        acknowledge-mode: manual
        default-requeue-rejected: false
        prefetch: 10

rabbitmq:
  exchange: pedidos360.eventos
  dead-letter-exchange: pedidos360.eventos.dlx
  pedido-creado:
    queue: notificaciones.pedido.creado
    routing-key: pedido.creado
    dead-letter-queue: notificaciones.pedido.creado.dlq
    dead-letter-routing-key: notificaciones.pedido.creado.dlq

internal:
  token: ${INTERNAL_TOKEN}

management:
  endpoints:
    web:
      exposure:
        include: health,info
