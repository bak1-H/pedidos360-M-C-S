server:
  port: 8084

spring:
  application:
    name: notificaciones-service
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:guest}
    password: ${SPRING_RABBITMQ_PASSWORD:guest}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        acknowledge-mode: manual
        default-requeue-rejected: false
        prefetch: 10

rabbitmq:
  parked-confirm-timeout: 5s
  exchange: pedidos360.eventos
  dead-letter-exchange: pedidos360.eventos.dlx
  pedido-creado:
    queue: notificaciones.pedido.creado
    routing-key: pedido.creado
    dead-letter-queue: notificaciones.pedido.creado.dlq
    dead-letter-routing-key: notificaciones.pedido.creado.dlq
    parked-queue: notificaciones.pedido.creado.dlq.parked
  envio-asignado:
    queue: notificaciones.envio.asignado
    routing-key: envio.asignado
    dead-letter-queue: notificaciones.envio.asignado.dlq
    dead-letter-routing-key: notificaciones.envio.asignado.dlq
    parked-queue: notificaciones.envio.asignado.dlq.parked
  usuario-creado:
    queue: notificaciones.usuario.creado
    routing-key: usuario.creado
    dead-letter-queue: notificaciones.usuario.creado.dlq
    dead-letter-routing-key: notificaciones.usuario.creado.dlq
    parked-queue: notificaciones.usuario.creado.dlq.parked
  envio-entregado:
    queue: tickets.envio.entregado
    routing-key: envio.entregado
    dead-letter-queue: tickets.envio.entregado.dlq
    dead-letter-routing-key: tickets.envio.entregado.dlq
    parked-queue: tickets.envio.entregado.dlq.parked

tickets:
  output-dir: ${TICKETS_OUTPUT_DIR:./tickets}

management:
  endpoints:
    web:
      exposure:
        include: health,info
