<div class="app-shell">
  <div class="ambient ambient-left"></div>
  <div class="ambient ambient-right"></div>

  <header class="navbar">
    <a class="nav-brand" routerLink="/">
      <span class="brand-mark" aria-hidden="true"></span>
      <span class="brand-name">{{ appName }}</span>
    </a>

    @if (auth.isAuthenticated()) {
      <nav class="nav-links" aria-label="Secciones">
        @for (item of visibleNavigation(); track item.path) {
          <a
            [routerLink]="item.path"
            routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: item.exact ?? false }"
          >
            {{ item.label }}
          </a>
        }
      </nav>
    }

    <div class="nav-side">
      <div class="nav-clock" role="timer" aria-live="off">
        <span class="clock-time">{{ hora() }}</span>
        <span class="clock-date">{{ fecha() }}</span>
      </div>

      @if (auth.isAuthenticated()) {
        <div class="nav-user">
          <span class="nav-user-name">{{ auth.displayName() }}</span>
          <span class="nav-user-role">{{ auth.roles().join(' · ') || 'Sin rol asignado' }}</span>
        </div>
        <button type="button" class="nav-button" (click)="logout()">Salir</button>
      }
    </div>
  </header>

  <main class="workspace">
    <router-outlet />
  </main>
</div>
