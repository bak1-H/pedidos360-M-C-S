server:
  port: 8083

spring:
  application:
    name: envios-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:azure}
  jpa:
    open-in-view: false
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:guest}
    password: ${SPRING_RABBITMQ_PASSWORD:guest}
    connection-timeout: 3s

rabbitmq:
  exchange: pedidos360.eventos
  routing-keys:
    envio-asignado: envio.asignado
    envio-estado-cambiado: envio.estado_cambiado

internal:
  token: ${INTERNAL_TOKEN}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  health:
    rabbit:
      enabled: false
