# Perfil por defecto: Azure SQL. Credenciales solo por variable de entorno.
spring:
  datasource:
    url: ${ENVIOS_DB_URL}
    username: ${ENVIOS_DB_USERNAME}
    password: ${ENVIOS_DB_PASSWORD}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
    hikari:
      maximum-pool-size: 5
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        default_schema: envios
