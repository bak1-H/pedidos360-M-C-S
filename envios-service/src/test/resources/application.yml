spring:
  datasource:
    url: jdbc:h2:mem:envios;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        default_schema: ""

  kafka:
    bootstrap-servers: localhost:29092
    admin:
      auto-create: false
    listener:
      auto-startup: false

kafka:
  topics:
    envios-tracking:
      nombre: pedidos360.envios.tracking
      particiones: 3
      replicas: 3
      min-insync-replicas: 2
      cleanup-policy: compact,delete
      retention-ms: 259200000
      segment-ms: 3600000
      min-compaction-lag-ms: 60000

internal:
  token: test-token
