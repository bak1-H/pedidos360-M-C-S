# Perfil local: H2 en memoria, sin depender de Azure SQL.
# Levantar con: SPRING_PROFILES_ACTIVE=dev
spring:
  datasource:
    url: jdbc:h2:mem:usuariosdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  h2:
    console:
      enabled: true
