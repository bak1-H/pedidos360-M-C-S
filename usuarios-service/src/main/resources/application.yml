server:
  port: 8081

spring:
  application:
    name: usuarios-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:azure}
  jpa:
    open-in-view: false
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:guest}
    password: ${SPRING_RABBITMQ_PASSWORD:guest}
    connection-timeout: 3s

rabbitmq:
  exchange: pedidos360.eventos
  routing-keys:
    usuario-creado: usuario.creado

# Mismo nombre de propiedad y mismo header que usan pedidos-service y envios-service.
internal:
  token: ${INTERNAL_TOKEN}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  health:
    rabbit:
      enabled: false

logging:
  level:
    com.pedidos360.usuarios: DEBUG
