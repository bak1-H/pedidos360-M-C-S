server:
  port: 8082

spring:
  application:
    name: pedidos-service
  datasource:
    url: ${PEDIDOS_DB_URL}
    username: ${PEDIDOS_DB_USERNAME}
    password: ${PEDIDOS_DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        default_schema: pedidos

internal:
  token: ${INTERNAL_TOKEN}
