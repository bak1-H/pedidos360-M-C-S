spring:
  datasource:
    url: jdbc:h2:mem:pedidos;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        default_schema: ""
  rabbitmq:
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        auto-startup: false
        acknowledge-mode: manual
        default-requeue-rejected: false

internal:
  token: test-token

rabbitmq:
  exchange: pedidos360.eventos
  dead-letter-exchange: pedidos360.eventos.dlx
  routing-keys:
    pedido-creado: pedido.creado
  envio-asignado:
    queue: pedidos.envio.asignado
    routing-key: envio.asignado
    dead-letter-queue: pedidos.envio.asignado.dlq
    dead-letter-routing-key: pedidos.envio.asignado.dlq
  envio-estado-cambiado:
    queue: pedidos.envio.estado_cambiado
    routing-key: envio.estado_cambiado
    dead-letter-queue: pedidos.envio.estado_cambiado.dlq
    dead-letter-routing-key: pedidos.envio.estado_cambiado.dlq
