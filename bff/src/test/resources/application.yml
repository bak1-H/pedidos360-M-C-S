# Valores falsos: los tests reemplazan el JwtDecoder por un mock,
# nunca se llama a Azure AD de verdad.
spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://login.microsoftonline.com/tenant-de-prueba/v2.0
          jwk-set-uri: https://login.microsoftonline.com/tenant-de-prueba/discovery/v2.0/keys

azure:
  audiencia: api://pedidos360-bff-test

servicios:
  usuarios-url: http://localhost:9999
  pedidos-url: http://localhost:9998
  envios-url: http://localhost:9997
  internal-token: token-de-prueba

cors:
  origenes-permitidos: http://localhost:4200
